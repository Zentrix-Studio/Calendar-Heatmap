<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zentrix Calendar Heatmap — Hero</title>
  <style>
    html, body { margin: 0; }
    body {
      padding: 40px;
      background: linear-gradient(135deg, #EEEAFB 0%, #F4F2FA 55%, #EAF0FB 100%);
      display: flex; flex-direction: column; align-items: flex-start;
    }
    #root { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <div id="root"></div>
  <pre id="err" style="color:#b00;font:12px monospace;white-space:pre-wrap;padding:8px"></pre>
  <script>window.onerror=function(m,s,l,c,e){document.getElementById('err').textContent='ERR: '+m+' @'+l+':'+c+'\n'+(e&&e.stack||'');};</script>
  <script src="hero.js"></script>
</body>
</html>
