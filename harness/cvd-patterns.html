<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zentrix Calendar Heatmap — CVD texture patterns (Z-149)</title>
  <style>
    /* Tokens are the ONLY source of color (mirrors src/theme/zentrixTokens.ts, Z-148). */
    :root {
      --surfaceBase: #0A0A0F;
      --surfaceOverlay: #24242F;
      --surfaceCard: #16161F;
      --accent: #7C5CFF;
      --accentStrong: #6344E0;
      --textPrimary: #F4F4F6;
      --textSecondary: #A6A6B5;
      --textTertiary: #70707F;
      --fontFamily: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    html, body { margin: 0; padding: 0; background: var(--surfaceBase); }
    body { font-family: var(--fontFamily); }
    .card {
      position: relative;
      background: var(--surfaceBase);
      box-sizing: border-box;
      overflow: hidden;
    }
    .card::after {
      content: ""; position: absolute; inset: 24px; border-radius: 14px;
      border: 1px solid var(--surfaceOverlay); pointer-events: none;
    }
    /* 1200x627 landscape */
    #card-landscape { width: 1200px; height: 627px; padding: 56px 64px; }
    /* 1080x1080 square */
    #card-square { width: 1080px; height: 1080px; padding: 72px 72px; }

    .eyebrow {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--textSecondary);
    }
    .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .h1 {
      margin: 14px 0 4px 0; color: var(--textPrimary);
      font-size: 40px; font-weight: 600; line-height: 1.1; max-width: 760px;
    }
    .sub { color: var(--textSecondary); font-size: 18px; font-weight: 400; margin-top: 2px; }

    .band { display: flex; justify-content: center; align-items: flex-end; gap: 56px; }
    .col { display: flex; flex-direction: column; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 6px; }
    .clabel { margin-top: 16px; font-size: 15px; font-weight: 500; color: var(--textSecondary); text-align: center; }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; color: var(--textTertiary);
    }
    #card-square .h1 { font-size: 44px; max-width: 900px; }
    #card-square .band { flex-wrap: wrap; gap: 40px 56px; max-width: 760px; margin: 0 auto; }

    #err { color:#ff6b6b; font:12px monospace; white-space:pre-wrap; padding:8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <pre id="err"></pre>
  <script>
    window.onerror = function(m,s,l,c,e){
      document.getElementById('err').textContent = 'ERR: '+m+' @'+l+':'+c+'\n'+((e&&e.stack)||'');
    };

    // ---- Tokens (verbatim from src/theme/zentrixTokens.ts) ----
    const TOK = {
      accent: "#7C5CFF",
      accentStrong: "#6344E0",
      textPrimary: "#F4F4F6",      // STROKE_DARK (light stroke on dark fill)
    };
    // CVD contrast baseline carried over verbatim from patterns.ts:
    const STROKE_OPACITY_DARK = 0.62; // light stroke on dark themes
    const STROKE_WIDTH_BASE = 0.9;

    const PATTERNS = [
      { key: "diagonal",   label: "Diagonal lines" },
      { key: "dots",       label: "Dots" },
      { key: "crosshatch", label: "Crosshatch" },
      { key: "grid",       label: "Grid" },
      { key: "stars",      label: "Stars" },
    ];

    const SVGNS = "http://www.w3.org/2000/svg";

    // paintTile — replicated 1:1 from src/render/patterns.ts paintTile().
    // pat: the <pattern> element; style; t: tile size; stroke {color,opacity,width}
    function paintTile(pat, style, t, s) {
      const line = (x1,y1,x2,y2) => {
        const el = document.createElementNS(SVGNS, "line");
        el.setAttribute("x1",x1); el.setAttribute("y1",y1);
        el.setAttribute("x2",x2); el.setAttribute("y2",y2);
        el.setAttribute("stroke", s.color);
        el.setAttribute("stroke-opacity", s.opacity);
        el.setAttribute("stroke-width", s.width);
        el.setAttribute("stroke-linecap", "round");
        pat.appendChild(el);
      };
      const dot = (cx,cy,r) => {
        const el = document.createElementNS(SVGNS, "circle");
        el.setAttribute("cx",cx); el.setAttribute("cy",cy); el.setAttribute("r",r);
        el.setAttribute("fill", s.color); el.setAttribute("fill-opacity", s.opacity);
        pat.appendChild(el);
      };
      switch (style) {
        case "diagonal":
          line(0,t,t,0); line(-1,1,1,-1); line(t-1,t+1,t+1,t-1);
          break;
        case "crosshatch":
          line(0,t,t,0); line(-1,1,1,-1); line(t-1,t+1,t+1,t-1);
          line(0,0,t,t); line(t-1,-1,t+1,1); line(-1,t-1,1,t+1);
          break;
        case "grid":
          line(0,0,t,0); line(0,0,0,t);
          break;
        case "dots": {
          const r = Math.max(0.8, t*0.16);
          dot(t/2, t/2, r);
          break;
        }
        case "stars": {
          const c = t/2, r = Math.max(1.5, t*0.42);
          line(c, c-r, c, c+r); line(c-r, c, c+r, c);
          const d = r*0.55;
          line(c-d, c-d, c+d, c+d); line(c-d, c+d, c+d, c-d);
          break;
        }
      }
    }

    let uid = 0;
    // Build one 64x64 cell: accent fill + a <pattern> overlay at tile size t.
    function buildCell(style, t, fillSpec, cellSize) {
      const svg = document.createElementNS(SVGNS, "svg");
      svg.setAttribute("width", cellSize); svg.setAttribute("height", cellSize);
      svg.setAttribute("viewBox", `0 0 ${cellSize} ${cellSize}`);
      svg.style.display = "block"; svg.style.borderRadius = "2px"; // markRadiusCell = 2

      const defs = document.createElementNS(SVGNS, "defs");
      const id = `zx-pat-${style}-${uid++}`;
      const pat = document.createElementNS(SVGNS, "pattern");
      pat.setAttribute("id", id);
      pat.setAttribute("patternUnits", "userSpaceOnUse");
      pat.setAttribute("width", t); pat.setAttribute("height", t);
      // scale stroke width gently with tile so it reads at poster scale
      const sw = (STROKE_WIDTH_BASE * (t/8)).toFixed(2);
      paintTile(pat, style, t, { color: TOK.textPrimary, opacity: STROKE_OPACITY_DARK, width: sw });
      defs.appendChild(pat);
      svg.appendChild(defs);

      // surfaceBase under-fill so the low-intensity accent composite is deterministic
      const base = document.createElementNS(SVGNS, "rect");
      base.setAttribute("x",0); base.setAttribute("y",0);
      base.setAttribute("width",cellSize); base.setAttribute("height",cellSize);
      base.setAttribute("rx",2); base.setAttribute("fill", "#0A0A0F"); // surfaceBase
      svg.appendChild(base);

      // base accent fill
      const bg = document.createElementNS(SVGNS, "rect");
      bg.setAttribute("x",0); bg.setAttribute("y",0);
      bg.setAttribute("width",cellSize); bg.setAttribute("height",cellSize);
      bg.setAttribute("rx",2); bg.setAttribute("fill", fillSpec.fill);
      bg.setAttribute("fill-opacity", fillSpec.op);
      svg.appendChild(bg);

      // pattern overlay rect (pointer-events:none in product)
      const ov = document.createElementNS(SVGNS, "rect");
      ov.setAttribute("x",0); ov.setAttribute("y",0);
      ov.setAttribute("width",cellSize); ov.setAttribute("height",cellSize);
      ov.setAttribute("rx",2); ov.setAttribute("fill", `url(#${id})`);
      svg.appendChild(ov);
      return svg;
    }

    // Tile sizes per pattern per intensity (low,mid,high) — from spec §3.
    const TILES = {
      diagonal:   [16, 12, 9],
      dots:       [18, 13, 10],
      crosshatch: [18, 13, 10],
      grid:       [18, 13, 10],
      stars:      [22, 16, 12],
    };
    // accent intensity ramp (low->high) — STRICTLY token-derived, no off-brand hex.
    // The hue is always the accent family. Lower intensity = accent at reduced
    // fill-opacity over surfaceBase (a token composition), high = accentStrong.
    // {fill, opacity} pairs; opacity composites accent onto the #0A0A0F card.
    const FILLS = [
      { fill: TOK.accent,       op: 0.55 }, // low  — accent, muted onto surfaceBase
      { fill: TOK.accent,       op: 1.0  }, // mid  — accent solid (#7C5CFF)
      { fill: TOK.accentStrong, op: 1.0  }, // high — accentStrong (#6344E0)
    ];

    function buildBand(cellSize) {
      const band = document.createElement("div");
      band.className = "band";
      PATTERNS.forEach(p => {
        const col = document.createElement("div");
        col.className = "col";
        const stack = document.createElement("div");
        stack.className = "stack";
        for (let i=0;i<3;i++){
          stack.appendChild(buildCell(p.key, TILES[p.key][i], FILLS[i], cellSize));
        }
        col.appendChild(stack);
        const lab = document.createElement("div");
        lab.className = "clabel"; lab.textContent = p.label;
        col.appendChild(lab);
        band.appendChild(col);
      });
      return band;
    }

    function buildCard(variant) {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "card-" + variant;

      const eyebrow = document.createElement("div");
      eyebrow.className = "eyebrow";
      const dot = document.createElement("span"); dot.className = "dot";
      eyebrow.appendChild(dot);
      eyebrow.appendChild(document.createTextNode("Zentrix Calendar Heatmap"));

      const h1 = document.createElement("div");
      h1.className = "h1"; h1.textContent = "Readable without relying on color.";

      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = "Heatmap intensity in texture, not just hue — colorblind-safe by design.";

      const cellSize = variant === "square" ? 72 : 64;
      const band = buildBand(cellSize);

      const footer = document.createElement("div");
      footer.className = "footer";
      const left = document.createElement("span"); left.textContent = "Texture + color, never color alone.";
      const right = document.createElement("span"); right.textContent = "zentrixstudio.in";
      footer.appendChild(left); footer.appendChild(right);

      // spacer flex so band sits centered between header and footer
      const head = document.createElement("div");
      head.appendChild(eyebrow); head.appendChild(h1); head.appendChild(sub);

      card.style.display = "flex";
      card.style.flexDirection = "column";
      card.style.justifyContent = "space-between";
      card.appendChild(head);
      card.appendChild(band);
      card.appendChild(footer);
      return card;
    }

    const variant = (location.hash || "#landscape").slice(1);
    const root = document.getElementById("root");
    root.appendChild(buildCard(variant === "square" ? "square" : "landscape"));
  </script>
</body>
</html>
